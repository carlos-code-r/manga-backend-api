<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <aside class="barra-lateral">
        <h2>Dashboard</h2>
        <nav class="menu-navegacion">
            <a href="#" class="activo" onclick="verSection('dashboard')">🏠 Dashboard</a>
            <a href="../usuarios/usuarios.html" id="link-usuarios">👥 Usuarios</a>
            <a href="../catalogo/index.html">📚 Catalogo</a></nav>

          <button onclick="cerrarSesion()" class="btn-logout-sidebar">
        <span>🚪</span> Cerrar Sesión
    </button>
    </aside>

    <main class="contenido-principal">
        <section id="dashboard" class="view">
            <header class="cabecera-seccion">
                <div>
                    <h1>Catálogo de Mangas</h1>
                    <p>Gestiona los títulos, estados y capítulos de tu base de datos.</p>
                </div>
                <button class="boton-crear" onclick="window.location.href='../registro/registro.html'">+ AÑADIR NUEVO MANGA</button>
            </header>

            <section class="seccion-tabla">
                <table class="tabla-gestion">
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Publicación</th>
                            <th>Capítulos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-mangas-body">
                        </tbody>
                </table>

                <div class="paginacion-container">
                    <button id="btn-anterior" class="btn-pag" onclick="paginaAnterior()">«</button>
                    <div id="paginas-numeros" class="paginas-numeros">
                        </div>
                    <button id="btn-siguiente" class="btn-pag" onclick="paginaSiguiente()">»</button>
                </div>
            </section>
        </section>

        <section id="form-manga" class="view" style="display:none;">
            <h1>Añadir Nuevo Manga</h1>
            <button onclick="verSection('dashboard')">Volver al catálogo</button>
            </section>
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
