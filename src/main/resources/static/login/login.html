<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrativo | MangaFenrir</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <form id="form-login" class="login-card">
            <div class="login-header">
                <h1>MANGAFENRIR</h1>
                <p>Panel de Creadores</p>
            </div>

            <div id="error-login" class="error-banner" style="display: none;">
                ⚠️ Usuario o contraseña incorrectos
            </div>

            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Nombre de usuario" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">ENTRAR AL PANEL</button>
            
            <div class="login-footer">
                <a href="../catalogo/index.html">← Volver al Catálogo Público</a>
            </div>
        </form>
    </div>
    <script src="login.js"></script>
</body>
</html>
